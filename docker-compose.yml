services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: collab_board
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_board"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
