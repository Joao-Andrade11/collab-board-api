spring.application.name=collab-board-api

server.port=8080

spring.datasource.url=jdbc:h2:mem:collab_board;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=${JWT_SECRET:c2VjdXJlLWNvbGxhYi1ib2FyZC1kZXYtc2VjcmV0LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
